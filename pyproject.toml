[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayusetu-asr"
version = "0.1.0"
description = "AyuSetu AI — ASR module (Hindi/English/Hinglish)"
requires-python = ">=3.10"
dependencies = [
    "transformers==4.44.2",
    "torch",
    "huggingface-hub>=0.22.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "numpy<2.0.0,>=1.26.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["neeraj*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
